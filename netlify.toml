[build]
  command = "node build-articles.js"
  publish = "."

# Netlify serves the repo root (the site is a flat, hand-maintained static build),
# so the authoring tool, the build scripts and the content sources would otherwise
# be downloadable from the public domain. They are already public on GitHub, but
# they have no business being served by the site itself.
#
# 404.html in the root is picked up automatically by Netlify and returned with a
# 404 status for every unmatched path — no catch-all rule needed.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/cms.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/content.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/site.config.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/build-articles.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/article-builder.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/articles-md.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/release.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/release.bat"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/publish.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/publish.bat"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.pages.yml"
  to = "/"
  status = 404
  force = true

# ---------- 缓存 ----------
# Netlify 按顺序匹配，最后的规则覆盖前面的 —— 所以更具体的路径要写在后面。
# 图片会被在线后台以同名覆盖上传，缓存留短一点，避免换图后访客仍看到旧图。
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 字体文件名固定、内容不变，可以长缓存。
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 不加长缓存：Netlify 默认给 max-age=0,must-revalidate，走协商缓存，发布后立刻可见。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
