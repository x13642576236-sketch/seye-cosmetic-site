[build]
  command = "node build-articles.js"
  publish = "."

# Netlify serves the repo root (the site is a flat, hand-maintained static build),
# so the authoring tool, the build scripts and the content sources would otherwise
# be downloadable from the public domain. They are already public on GitHub, but
# they have no business being served by the site itself.
#
# 404.html in the root is picked up automatically by Netlify and returned with a
# 404 status for every unmatched path — no catch-all rule needed.
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/cms.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/content.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/site.config.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/build-articles.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/article-builder.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/articles-md.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/release.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/release.bat"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/publish.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/publish.bat"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.pages.yml"
  to = "/"
  status = 404
  force = true

# ---------- 缓存 ----------
# Netlify 按顺序匹配，最后的规则覆盖前面的 —— 所以更具体的路径要写在后面。
# 图片会被在线后台以同名覆盖上传，缓存留短一点，避免换图后访客仍看到旧图。
# 字体二进制：文件名固定、内容永不变，可以长缓存。
# fonts.css 已移到 /assets/ 根目录，就是为了不落进这条规则。
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 其余资源不设长缓存：文件名不带内容哈希，长缓存会导致改完样式/换完图
# 回访用户仍看旧的。走协商缓存，几千字节的 304，换"发布即生效"。
# 详见 _headers 顶部说明（Cloudflare 的多条规则会拼接而不是覆盖）。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
